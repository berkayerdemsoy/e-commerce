server:
  port :8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service-route
              uri: lb://user-service
              predicates:
                - Path=/api/users/**
              filters:
                - RewritePath=/api/users/(?<segment>.*) , /$\{segment}

            - id: auth-service-route
              uri: lb://user-service
              predicates:
                - Path=/auth/**

