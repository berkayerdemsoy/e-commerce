services:
  redis:
    image: redis:7
    container_name: redis
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: on-failure
    ports:
      - "6379:6379"
    networks:
      - user-network

  cart-service:
    build:
      context: .
      dockerfile: cart-service/cart-service-app/Dockerfile
    container_name: cart-service
    restart: unless-stopped
    ports:
      - "8084:8080"
    depends_on:
      redis:
        condition: service_healthy
    environment:
       SPRING_DATA_REDIS_HOST: redis
       SPRING_DATA_REDIS_PORT: 6379
    networks:
      - user-network

  order-service:
    build:
      context: .
      dockerfile: order-service/order-service-app/Dockerfile
    container_name: order-service
    restart: unless-stopped
    ports:
      - "8085:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://order-db:5432/orderdb
      SPRING_DATASOURCE_USERNAME: berkay
      SPRING_DATASOURCE_PASSWORD: berkay
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "true"
    depends_on:
      - cart-service
      - order-db
    networks:
      - user-network

  payment-service:
    build:
      context: .
      dockerfile: payment-service/payment-service-app/Dockerfile
    container_name: payment-service
    restart: unless-stopped
    ports:
      - "8086:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://paymenet-db:5432/paymentdb
      SPRING_DATASOURCE_USERNAME: berkay
      SPRING_DATASOURCE_PASSWORD: berkay
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "true"
    depends_on:
      - payment-db
    networks:
      - user-network

  payment-db:
    image: postgres:15
    container_name: payment-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: paymentdb
      POSTGRES_USER: berkay
      POSTGRES_PASSWORD: berkay
    ports:
      - "5437:5432"
    volumes:
      - payment-db-data:/var/lib/postgresql/data
    networks:
      - user-network



  user-db:
    image: postgres:15
    container_name: user-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: userdb
      POSTGRES_USER: berkay
      POSTGRES_PASSWORD: berkay
    ports:
      - "5433:5432"
    volumes:
      - user-db-data:/var/lib/postgresql/data
    networks:
      - user-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: berkayerdemsoy@gmail.com
      PGADMIN_DEFAULT_PASSWORD: berkay123
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    ports:
      - "8888:80"
    depends_on:
      - user-db
    networks:
      - user-network

  user-service:
    build:
      context: .
      dockerfile: user-service/user-service-app/Dockerfile
    container_name: user-service
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - user-db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://user-db:5432/userdb
      SPRING_DATASOURCE_USERNAME: berkay
      SPRING_DATASOURCE_PASSWORD: berkay
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "true"
    networks:
      - user-network

  gateway-service:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - user-service
    networks:
      - user-network

  shop-service:
    build:
      context: .
      dockerfile: ./shop-service/shop-service-app/Dockerfile
    container_name: shop-service
    restart: unless-stopped
    ports:
      - "8082:8080"
    depends_on:
      - shop-db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://shop-db:5432/shopdb
      SPRING_DATASOURCE_USERNAME: berkay
      SPRING_DATASOURCE_PASSWORD: berkay
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "true"
    networks:
      - user-network
  shop-db:
    image: postgres:15
    container_name: shop-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: shopdb
      POSTGRES_USER: berkay
      POSTGRES_PASSWORD: berkay
    ports:
      - "5434:5432"
    volumes:
      - shop-db-data:/var/lib/postgresql/data
    networks:
      - user-network

  order-db:
    image: postgres:15
    container_name: order-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: orderdb
      POSTGRES_USER: berkay
      POSTGRES_PASSWORD: berkay
    ports:
      - "5436:5432"
    volumes:
      - order-db-data:/var/lib/postgresql/data
    networks:
      - user-network

  warehouse-service:
    build:
      context: .
      dockerfile: ./warehouse-service/warehouse-service-app/Dockerfile
    container_name: warehouse-service
    restart: unless-stopped
    ports:
      - "8083:8080"
    depends_on:
      - warehouse-db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://warehouse-db:5432/warehousedb
      SPRING_DATASOURCE_USERNAME: berkay
      SPRING_DATASOURCE_PASSWORD: berkay
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "true"
    networks:
      - user-network

  warehouse-db:
    image: postgres:15
    container_name: warehouse-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: warehousedb
      POSTGRES_USER: berkay
      POSTGRES_PASSWORD: berkay
    ports:
      - "5435:5432"
    volumes:
      - warehouse-db-data:/var/lib/postgresql/data
    networks:
      - user-network


  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "22181:2181"

  kafka:
    image: confluentinc/cp-kafka:latest
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "29092:29092"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on:
      - kafka
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181



volumes:
  user-db-data:
    name: user-db-data
    driver: local
  pgadmin-data:
    name: pgadmin-data
    driver: local
  shop-db-data:
    name: shop-db-data
    driver: local
  warehouse-db-data:
    name: warehouse-db-data
    driver: local
  order-db-data:
    name: order-db-data
    driver: local
  payment-db-data:
    name: payment-db-data
    driver: local

networks:
  user-network:
    driver: bridge
