services:
  redis:
    image: redis:7
    container_name: redis
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: on-failure
    ports:
      - "6379:6379"
    networks:
      - user-network

  keycloak:
    image: keycloak/keycloak:21.1.1
    container_name: keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    command: [ "start-dev", "--http-enabled=true", "--health-enabled=true" ]
    ports:
      - "8180:8080"
    networks:
      - user-network
    healthcheck:
      test: [ "CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && cat <&3 | grep -q '200 OK'" ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s



  cart-service:
    build:
      context: .
      dockerfile: cart-service/cart-service-app/Dockerfile
    container_name: cart-service
    restart: unless-stopped
    ports:
      - "8084:8080"
    depends_on:
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
       SPRING_DATA_REDIS_HOST: redis
       SPRING_DATA_REDIS_PORT: 6379
       SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8080/realms/myrealm
    networks:
      - user-network

  shipment-service:
    build:
      context: .
      dockerfile: shipment-service/Dockerfile
    container_name: shipment-service
    restart: unless-stopped
    ports:
      - "8087:8080"
    depends_on:
       kafka:
          condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://shipment-db:5432/shipmentdb
      SPRING_DATASOURCE_USERNAME: berkay
      SPRING_DATASOURCE_PASSWORD: berkay
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "true"
    networks:
      - user-network

  shipment-db:
    image: postgres:15
    container_name: shipment-db
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://shipment-db:5432/shipmentdb
      SPRING_DATASOURCE_USERNAME: berkay
      SPRING_DATASOURCE_PASSWORD: berkay
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "true"
    ports:
      - "5438:5432"
    volumes:
      - shipment-db-data:/var/lib/postgresql/data
    networks:
      - user-network


  order-service:
    build:
      context: .
      dockerfile: order-service/order-service-app/Dockerfile
    container_name: order-service
    restart: unless-stopped
    ports:
      - "8085:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://order-db:5432/orderdb
      SPRING_DATASOURCE_USERNAME: berkay
      SPRING_DATASOURCE_PASSWORD: berkay
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "true"
      ORDER_SERVICE_CLIENT_ID: ${ORDER_SERVICE_CLIENT_ID:-order-service-client}
      ORDER_SERVICE_CLIENT_SECRET: ${ORDER_SERVICE_CLIENT_SECRET}
    depends_on:
      cart-service:
        condition: service_started
      order-db:
        condition: service_started
      keycloak:
        condition: service_healthy
    networks:
      - user-network

  payment-service:
    build:
      context: .
      dockerfile: payment-service/payment-service-app/Dockerfile
    container_name: payment-service
    restart: unless-stopped
    ports:
      - "8086:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://payment-db:5432/paymentdb
      SPRING_DATASOURCE_USERNAME: berkay
      SPRING_DATASOURCE_PASSWORD: berkay
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "true"
    depends_on:
       kafka:
          condition: service_healthy
       payment-db:
         condition: service_started
    networks:
      - user-network

  payment-db:
    image: postgres:15
    container_name: payment-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: paymentdb
      POSTGRES_USER: berkay
      POSTGRES_PASSWORD: berkay
    ports:
      - "5437:5432"
    volumes:
      - payment-db-data:/var/lib/postgresql/data
    networks:
      - user-network



  user-db:
    image: postgres:15
    container_name: user-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: userdb
      POSTGRES_USER: berkay
      POSTGRES_PASSWORD: berkay
    ports:
      - "5433:5432"
    volumes:
      - user-db-data:/var/lib/postgresql/data
    networks:
      - user-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: berkayerdemsoy@gmail.com
      PGADMIN_DEFAULT_PASSWORD: berkay123
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    ports:
      - "8888:80"
    depends_on:
      - user-db
    networks:
      - user-network

  user-service:
    build:
      context: .
      dockerfile: user-service/user-service-app/Dockerfile
    container_name: user-service
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - user-db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://user-db:5432/userdb
      SPRING_DATASOURCE_USERNAME: berkay
      SPRING_DATASOURCE_PASSWORD: berkay
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "true"
    networks:
      - user-network

  gateway-service:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      user-service:
        condition: service_started
      keycloak:
        condition: service_healthy
    networks:
      - user-network

  shop-service:
    build:
      context: .
      dockerfile: ./shop-service/shop-service-app/Dockerfile
    container_name: shop-service
    restart: unless-stopped
    ports:
      - "8082:8080"
    depends_on:
      - shop-db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://shop-db:5432/shopdb
      SPRING_DATASOURCE_USERNAME: berkay
      SPRING_DATASOURCE_PASSWORD: berkay
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "true"
    networks:
      - user-network
  shop-db:
    image: postgres:15
    container_name: shop-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: shopdb
      POSTGRES_USER: berkay
      POSTGRES_PASSWORD: berkay
    ports:
      - "5434:5432"
    volumes:
      - shop-db-data:/var/lib/postgresql/data
    networks:
      - user-network

  order-db:
    image: postgres:15
    container_name: order-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: orderdb
      POSTGRES_USER: berkay
      POSTGRES_PASSWORD: berkay
    ports:
      - "5436:5432"
    volumes:
      - order-db-data:/var/lib/postgresql/data
    networks:
      - user-network

  warehouse-service:
    build:
      context: .
      dockerfile: ./warehouse-service/warehouse-service-app/Dockerfile
    container_name: warehouse-service
    restart: unless-stopped
    ports:
      - "8083:8080"
    depends_on:
      - warehouse-db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://warehouse-db:5432/warehousedb
      SPRING_DATASOURCE_USERNAME: berkay
      SPRING_DATASOURCE_PASSWORD: berkay
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "true"
    networks:
      - user-network

  warehouse-db:
    image: postgres:15
    container_name: warehouse-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: warehousedb
      POSTGRES_USER: berkay
      POSTGRES_PASSWORD: berkay
    ports:
      - "5435:5432"
    volumes:
      - warehouse-db-data:/var/lib/postgresql/data
    networks:
      - user-network


  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_4LW_COMMANDS_WHITELIST: "*"
    ports:
      - "22181:2181"
    networks:
      - user-network
    healthcheck:
      test: [ "CMD-SHELL", "echo srvr | nc localhost 2181 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

    ports:
      - "29092:29092"
    networks:
      - user-network
    healthcheck:
      test: [ "CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s


  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - user-network


volumes:
  user-db-data:
    name: user-db-data
    driver: local
  pgadmin-data:
    name: pgadmin-data
    driver: local
  shop-db-data:
    name: shop-db-data
    driver: local
  warehouse-db-data:
    name: warehouse-db-data
    driver: local
  order-db-data:
    name: order-db-data
    driver: local
  payment-db-data:
    name: payment-db-data
    driver: local
  shipment-db-data:
    name: shipment-db-data
    driver: local

networks:
  user-network:
    driver: bridge
